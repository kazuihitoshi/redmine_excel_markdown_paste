# Local trial for this plugin.
# Redmine is pinned to the version of the environment this plugin was built against.
services:
  redmine:
    image: redmine:6.1.2
    ports:
      - "3000:3000"
    environment:
      REDMINE_DB_MYSQL: db
      REDMINE_DB_DATABASE: redmine
      REDMINE_DB_USERNAME: redmine
      REDMINE_DB_PASSWORD: redmine
    volumes:
      - ./temp/files:/usr/src/redmine/files
      - ./temp/log:/usr/src/redmine/log
      - ./temp/plugins:/usr/src/redmine/plugins
      - ./temp/themes:/usr/src/redmine/public/themes
      - ./:/usr/src/redmine/plugins/excel_markdown_paste
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mariadb:10.11
    environment:
      MARIADB_ROOT_PASSWORD: redmine
      MARIADB_DATABASE: redmine
      MARIADB_USER: redmine
      MARIADB_PASSWORD: redmine
    volumes:
      - ./temp/db:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -uroot -p$$MARIADB_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
